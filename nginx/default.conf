server {
    listen 80;
    server_name _;

    location /users {
        proxy_pass http://user-service:5000;
    }

    location /products {
        proxy_pass http://product-service:5000;
    }

    location /orders {
        proxy_pass http://order-service:5000;
    }

    location /user-health {
        proxy_pass http://user-service:5000/health;
    }

    location /product-health {
        proxy_pass http://product-service:5000/health;
    }

    location /order-health {
        proxy_pass http://order-service:5000/health;
    }

    location / {
        return 200 "Microservices API Gateway is running\n";
        add_header Content-Type text/plain;
    }
}
